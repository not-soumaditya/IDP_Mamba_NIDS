<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS-Mamba Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #58a6ff;
        }
        p {
            font-size: 1.2rem;
            color: #8b949e;
        }
        .badge {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.4rem 1rem;
            border: 1px solid #30363d;
            border-radius: 2rem;
            font-size: 0.85rem;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ NIDS-Mamba</h1>
        <p>Dashboard coming in Phase 4</p>
        <span class="badge">Real-Time Cyber Attack Detection using Mamba SSM</span>
    </div>
</body>
</html>
